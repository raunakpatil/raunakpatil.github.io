<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HQ · Raunak Patil</title>
  <!-- Raunak's command centre: the site's own analytics (worker/src/analytics.js). Private: behind a passphrase, and
       kept out of search engines. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="css/hq.css?v=1">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Raunak Patil <span class="brand-hq">HQ</span></a>
    <nav class="tabs" id="tabs" aria-label="Sections" hidden>
      <span class="tabs-indicator" aria-hidden="true"></span>
      <a href="#overview" data-tab="overview">Overview</a>
      <a href="#people" data-tab="people">People</a>
      <a href="#ronie" data-tab="ronie">Ronie</a>
      <a href="#radar" data-tab="radar">Radar</a>
      <a href="#work" data-tab="work">Work</a>
    </nav>
    <div class="bar-end" id="bar-end" hidden>
      <div class="range" id="range" role="group" aria-label="Period">
        <button type="button" data-days="1">24h</button>
        <button type="button" data-days="7">7d</button>
        <button type="button" data-days="30">30d</button>
        <button type="button" data-days="90">90d</button>
        <button type="button" data-days="365">1y</button>
      </div>
      <button type="button" class="round" id="refresh" aria-label="Refresh" title="Refresh">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v2.4h-2.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="round" id="lock" aria-label="Lock" title="Lock">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="login" id="login" hidden>
      <form class="card login-card" id="login-form">
        <p class="kicker"><i class="dot"></i> Command centre</p>
        <h1>Who's on the site,<br><em>and what they're doing.</em></h1>
        <label class="field">
          <span>Passphrase</span>
          <input type="password" id="key" autocomplete="current-password" required placeholder="ADMIN_TOKEN">
        </label>
        <button type="submit" class="go">Open HQ <b>→</b></button>
        <p class="login-err" id="login-err" role="alert"></p>
      </form>
    </section>

    <div class="status" id="status" hidden></div>

    <section class="view grid" data-view="overview" hidden></section>
    <section class="view grid" data-view="people" hidden></section>
    <section class="view grid" data-view="ronie" hidden></section>
    <section class="view grid" data-view="radar" hidden></section>
    <section class="view grid" data-view="work" hidden></section>
  </main>

  <dialog class="drawer" id="drawer" aria-label="Visitor">
    <div class="drawer-in" id="drawer-in"></div>
  </dialog>
  <div class="tip" id="tip" role="tooltip" hidden></div>

  <script src="js/hq.js?v=1" type="module"></script>
</body>
</html>
