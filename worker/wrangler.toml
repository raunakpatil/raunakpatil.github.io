# Ronie's chat worker — deploy with:  cd worker && npx wrangler deploy
name = "ronie-chat"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[ai]
binding = "AI"

# 30 chat or game turns per minute per visitor (game answers come quickly)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

# the Tools page's feed (src/feed.js): rebuilt every half hour into KV, so /feed answers at once
[[kv_namespaces]]
binding = "FEED"
id = "08e09fa0db2a4372bf3974b7042f3667"

[triggers]
crons = ["*/30 * * * *"]

# the command centre's analytics (src/analytics.js, read by hq.html). One-time setup (README → "Command centre"):
#   npx wrangler d1 create ronie-analytics      → paste the database_id it prints below, then uncomment these lines
#   npx wrangler secret put ADMIN_TOKEN          → the passphrase hq.html asks for
# Until then the site's beacon is simply ignored (the worker answers 204 and keeps nothing).
[[d1_databases]]
binding = "ronie_analytics"
database_name = "ronie-analytics"
database_id = "20bb5819-dac4-4a4a-9b28-84627d541173"
