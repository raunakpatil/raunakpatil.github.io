<!doctype html>
<!-- The site's share image (img/og.png, 1200x630: what a link to raunakpatil.com shows). Rendered by
     scripts/build-og.mjs. Edit this, then run it again. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --neu-out: -8px -8px 18px rgba(255, 255, 255, .95), 10px 12px 26px rgba(163, 168, 186, .55);
    --neu-out-sm: -4px -4px 10px rgba(255, 255, 255, .95), 5px 5px 12px rgba(163, 168, 186, .5);
    --key: inset 0 1px 1px rgba(255, 255, 255, .18), 0 4px 10px rgba(0, 0, 0, .22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #f2f2f2; color: #111; font-family: "Inter Tight", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .text { position: absolute; left: 76px; top: 70px; width: 670px; }
  .eyebrow { display: flex; align-items: center; gap: 12px; font-family: "JetBrains Mono", monospace; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; color: #8a8a8a; }
  .eyebrow i { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 5px rgba(34, 197, 94, .18); }
  h1 { margin-top: 30px; font-size: 106px; font-weight: 400; letter-spacing: -.04em; line-height: .98; }
  h1 em { display: block; font-style: normal; color: #9a9a9a; font-size: 66px; letter-spacing: -.03em; margin-top: 10px; }
  p { margin-top: 30px; font-size: 31px; line-height: 1.36; color: #6b6b6b; }
  p b { font-weight: 500; color: #1a1a1a; }   /* (the promise first, darker) */
  .chips { position: absolute; left: 76px; bottom: 64px; display: flex; gap: 12px; }
  .chip { padding: 13px 22px; border-radius: 999px; background: #fff; font-size: 21px; color: #333; box-shadow: var(--neu-out-sm); }
  .chip.key { background: #111; color: #fff; box-shadow: var(--key); }
  /* his photo, raised off the page like the site's ID card */
  .photo { position: absolute; right: 76px; top: 70px; width: 360px; height: 490px; padding: 12px; border-radius: 34px; background: #fff; box-shadow: var(--neu-out); }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; border-radius: 24px; }
</style>
</head>
<body>
  <div class="text">
    <div class="eyebrow"><i></i>Open to work</div>
    <h1>Raunak Patil<em>AI Engineer</em></h1>
    <p><b>Building LLM systems people can trust.</b><br>RAG, LLM evaluation and AI agents.<br>5+ years in AI/ML.</p>
  </div>
  <div class="chips"><span class="chip key">raunakpatil.com</span><span class="chip">Nagpur, India</span><span class="chip">MSc Data Science &amp; AI</span></div>
  <div class="photo"><img src="photo.png" alt=""></div>
</body>
</html>
